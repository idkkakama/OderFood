  </head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full px-margin-mobile bg-surface"><div class="flex flex-col w-full pb-8">
<!-- Minimalist Brand Header -->
<div class="flex flex-col items-center text-center mt-2 mb-6">
<div class="w-14 h-14 rounded-xl bg-surface-container-high flex items-center justify-center text-primary-container shadow-md mb-3">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">restaurant_menu</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Đăng nhập</h1>
<p class="font-body-sm text-body-sm text-outline mt-0.5">Hệ thống vận hành Restaurant OS</p>
</div>
<!-- Primary Container Card -->
<div class="bg-surface-container-low rounded-xl p-5 shadow-lg flex flex-col gap-5">
<!-- Tab Selector: Phone / Email -->
<div class="grid grid-cols-2 p-1 bg-surface-container-highest rounded-lg">
<button class="h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 bg-surface-container text-on-surface shadow-sm" id="tab-phone" onclick="switchTab('phone')" type="button">
<span class="material-symbols-outlined text-base">call</span>
        Số điện thoại
      </button>
<button class="h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 text-outline hover:text-on-surface" id="tab-email" onclick="switchTab('email')" type="button">
<span class="material-symbols-outlined text-base">alternate_email</span>
        Email
      </button>
</div>
<!-- Credentials Form -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- Account Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-outline uppercase tracking-wider" id="account-label">Số điện thoại</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none" id="account-icon">call</span>
<input class="w-full h-12 bg-surface-container-highest text-on-surface placeholder:text-outline font-body-md text-body-md pl-11 pr-4 rounded-lg focus:outline-none focus:bg-surface-container transition-colors" id="account-input" placeholder="09xx xxx xxx" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Mật khẩu</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none">lock</span>
<input class="w-full h-12 bg-surface-container-highest text-on-surface placeholder:text-outline font-body-md text-body-md pl-11 pr-12 rounded-lg focus:outline-none focus:bg-surface-container transition-colors" id="password-input" placeholder="••••••••" type="password"/>
<button class="absolute right-2.5 h-8 w-8 flex items-center justify-center text-outline hover:text-on-surface rounded-md focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-xl" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Utilities Row: Remember & Forgot -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded accent-primary-container bg-surface-container-highest cursor-pointer" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Ghi nhớ phiên</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#forgot">Quên mật khẩu?</a>
</div>
<!-- Primary Action CTA -->
<button class="mt-2 w-full h-[52px] bg-primary-container active:brightness-90 text-on-primary font-headline-sm text-headline-sm uppercase tracking-wide rounded-lg flex items-center justify-center gap-2 shadow-md transition-all" type="submit">
<span>ĐĂNG NHẬP</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<!-- Shift Fast Login (PIN Option) -->
<div class="pt-3 flex flex-col gap-3">
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center"><div class="w-full bg-surface-container-highest h-[1px]"></div></div>
<span class="relative px-3 bg-surface-container-low font-label-sm text-label-sm text-outline">HOẶC NHÂN VIÊN CA</span>
</div>
<button class="w-full h-12 bg-surface-container hover:bg-surface-container-high text-on-surface rounded-lg font-label-md text-label-md flex items-center justify-center gap-2.5 transition-colors" onclick="togglePinModal(true)" type="button">
<span class="material-symbols-outlined text-secondary text-xl">dialpad</span>
<span>Vào nhanh bằng PIN 4 số</span>
</button>
</div>
</div>
<!-- Footer Link: Sign Up -->
<div class="mt-8 flex items-center justify-center gap-1.5 text-center">
<span class="font-body-sm text-body-sm text-outline">Chưa có tài khoản?</span>
<a class="font-label-md text-label-md text-primary hover:underline font-semibold" href="#register">Đăng ký ngay</a>
</div>
<!-- PIN Modal for Shift Workers -->
<div class="fixed inset-0 z-50 hidden bg-surface-dim/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4" id="pin-modal">
<div class="w-full max-w-sm bg-surface-container rounded-xl p-5 shadow-2xl flex flex-col items-center">
<div class="flex items-center justify-between w-full mb-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-xl">badge</span>
<span class="font-label-md text-label-md text-on-surface">Mã PIN ca làm</span>
</div>
<button class="text-outline hover:text-on-surface p-1" onclick="togglePinModal(false)" type="button">
<span class="material-symbols-outlined text-xl">close</span>
</button>
</div>
<!-- PIN dots -->
<div class="flex gap-4 my-4">
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest" id="pin-dot-1"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest" id="pin-dot-2"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest" id="pin-dot-3"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest" id="pin-dot-4"></div>
</div>
<!-- Number Pad -->
<div class="grid grid-cols-3 gap-2.5 w-full mt-2">
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('1')" type="button">1</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('2')" type="button">2</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('3')" type="button">3</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('4')" type="button">4</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('5')" type="button">5</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('6')" type="button">6</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('7')" type="button">7</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('8')" type="button">8</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('9')" type="button">9</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-label-md text-label-md text-outline flex items-center justify-center" onclick="clearPin()" type="button">C</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-on-surface flex items-center justify-center" onclick="enterPin('0')" type="button">0</button>
<button class="h-12 bg-surface-container-high active:bg-surface-container-highest rounded-lg font-headline-sm text-headline-sm text-outline flex items-center justify-center" onclick="backspacePin()" type="button">
<span class="material-symbols-outlined text-lg">backspace</span>
</button>
</div>
</div>
</div>
</div>
<script>
  let currentPin = '';

  function switchTab(type) {
    const btnPhone = document.getElementById('tab-phone');
    const btnEmail = document.getElementById('tab-email');
    const accountLabel = document.getElementById('account-label');
    const accountInput = document.getElementById('account-input');
    const accountIcon = document.getElementById('account-icon');

    if (type === 'phone') {
      btnPhone.className = "h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 bg-surface-container text-on-surface shadow-sm";
      btnEmail.className = "h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 text-outline hover:text-on-surface";
      accountLabel.innerText = "Số điện thoại";
      accountInput.type = "tel";
      accountInput.placeholder = "09xx xxx xxx";
      accountIcon.innerText = "call";
    } else {
      btnEmail.className = "h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 bg-surface-container text-on-surface shadow-sm";
      btnPhone.className = "h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 text-outline hover:text-on-surface";
      accountLabel.innerText = "Địa chỉ Email";
      accountInput.type = "email";
      accountInput.placeholder = "nhanvien@restaurant.vn";
      accountIcon.innerText = "alternate_email";
    }
  }

  function togglePasswordVisibility() {
    const pwd = document.getElementById('password-input');
    const icon = document.getElementById('eye-icon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.innerText = 'visibility_off';
    } else {
      pwd.type = 'password';
      icon.innerText = 'visibility';
    }
  }

  function togglePinModal(show) {
    const modal = document.getElementById('pin-modal');
    if (show) {
      modal.classList.remove('hidden');
      clearPin();
    } else {
      modal.classList.add('hidden');
      clearPin();
    }
  }

  function enterPin(digit) {
    if (currentPin.length < 4) {
      currentPin += digit;
      updatePinDisplay();
      if (currentPin.length === 4) {
        setTimeout(() => {
          togglePinModal(false);
        }, 200);
      }
    }
  }

  function backspacePin() {
    if (currentPin.length > 0) {
      currentPin = currentPin.slice(0, -1);
      updatePinDisplay();
    }
  }

  function clearPin() {
    currentPin = '';
    updatePinDisplay();
  }

  function updatePinDisplay() {
    for (let i = 1; i <= 4; i++) {
      const dot = document.getElementById(`pin-dot-${i}`);
      if (i <= currentPin.length) {
        dot.className = "w-3.5 h-3.5 rounded-full bg-primary-container scale-110 transition-transform";
      } else {
        dot.className = "w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-transform";
      }
    }
  }
</script></main></body></html>
